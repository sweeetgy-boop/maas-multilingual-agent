version: 0.0
os: linux

files:
  - source: gate
    destination: /opt/maas/gate
  - source: ui
    destination: /opt/maas/ui

  - source: requirements.txt
    destination: /opt/maas
file_exists_behavior: OVERWRITE

hooks:
  ApplicationStop:
    - location: scripts/deploy/application_stop.sh
      timeout: 60
      runas: root
  BeforeInstall:
    - location: scripts/deploy/before_install.sh
      timeout: 60
      runas: root
  AfterInstall:
    - location: scripts/deploy/after_install.sh
      timeout: 120
      runas: root
  ApplicationStart:
    - location: scripts/deploy/application_start.sh
      timeout: 60
      runas: root
  ValidateService:
    - location: scripts/deploy/validate_service.sh
      timeout: 60
      runas: root
