name: Deploy

# CI(.github/workflows/ci.yml, 워크플로 이름 "CI")가 main 에서 성공한 뒤에만
# 실행된다. push 이벤트를 직접 트리거로 쓰지 않는 이유: CI 통과를 보장하려면
# workflow_run 이 필요하다 — push 트리거로는 다른 워크플로의 성패를 알 수 없다.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# 동시 배포 방지. cancel-in-progress 를 false 로 두는 이유: 배포 도중(특히
# SSM 명령 실행 중) 취소하면 S3 는 새 버전, EC2 는 이전 버전이 실행 중인
# 상태로 남거나 systemctl restart 중간에 끊길 수 있다. 뒤에 들어온 실행은
# 취소하지 않고 앞선 실행이 끝날 때까지 대기시킨다.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2   # HEAD^ 비교(워크플로 전용 커밋 판별)에 필요

      # ── 안전장치: .github/workflows/ 변경만 있는 커밋은 배포 생략 ──
      # HEAD^..HEAD(마지막 커밋)만 비교한다. 한 번의 push 에 여러 커밋이
      # 섞여 있고 마지막 커밋만 워크플로 전용인 경우는 감지하지 못할 수
      # 있다 — 이 저장소는 보통 커밋 단위로 push 하므로 실용적 근사치로
      # 충분하다고 판단했다. 더 엄격하게 하려면 push 이벤트의 before SHA
      # 가 필요한데 workflow_run 페이로드에는 없다.
      - name: 워크플로 전용 커밋인지 확인
        id: filter
        run: |
          CHANGED=$(git diff --name-only HEAD^ HEAD)
          echo "변경된 파일:"
          echo "$CHANGED"

          workflow_only=false
          if [ -n "$CHANGED" ]; then
            workflow_only=true
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                .github/workflows/*) ;;
                *) workflow_only=false ;;
              esac
            done <<< "$CHANGED"
          fi

          echo "workflow_only=$workflow_only" >> "$GITHUB_OUTPUT"
          if [ "$workflow_only" = "true" ]; then
            echo "::notice::.github/workflows/ 변경만 있는 커밋이라 배포를 건너뜁니다"
          fi

      - name: AWS 자격 증명 설정
        if: steps.filter.outputs.workflow_only != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # ── 안전장치: 인스턴스가 정지 중이면 건너뛰고 성공 처리 ──
      # 교육 계정이라 비용 절감을 위해 EC2 를 자주 정지해 둔다. SSM 명령은
      # 정지된 인스턴스에 보낼 수 없으므로, 여기서 미리 걸러 워크플로 전체가
      # 빨간불이 되는 것을 막는다.
      - name: EC2 인스턴스 상태 확인
        if: steps.filter.outputs.workflow_only != 'true'
        id: check_instance
        run: |
          STATE=$(aws ec2 describe-instances \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)
          echo "인스턴스 상태: $STATE"
          if [ "$STATE" = "running" ]; then
            echo "running=true" >> "$GITHUB_OUTPUT"
          else
            echo "running=false" >> "$GITHUB_OUTPUT"
            echo "::warning::EC2 인스턴스가 '$STATE' 상태라 배포를 건너뜁니다"
          fi

      - name: S3 동기화 (gate/)
        if: steps.filter.outputs.workflow_only != 'true' && steps.check_instance.outputs.running == 'true'
        run: |
          aws s3 sync gate/ s3://maas-deploy-508139322599/app/gate/ --delete \
            --exclude "__pycache__/*" --exclude "*.db" --exclude "*.zip"

      - name: S3 동기화 (ui/)
        if: steps.filter.outputs.workflow_only != 'true' && steps.check_instance.outputs.running == 'true'
        run: |
          aws s3 sync ui/ s3://maas-deploy-508139322599/app/ui/ --delete \
            --exclude "__pycache__/*"

      # vLLM 컨테이너(8000번 포트)는 이 배포와 무관하다 — 절대 재시작하지
      # 않는다. 아래 명령은 maas-api systemd 서비스만 건드린다. 환경변수
      # (API 키 등)는 EC2 의 systemd 유닛 파일에 있으므로 여기서 다루지 않는다.
      - name: SSM 으로 배포 명령 전송
        if: steps.filter.outputs.workflow_only != 'true' && steps.check_instance.outputs.running == 'true'
        id: ssm_send
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "cd /opt/maas",
              "aws s3 sync s3://maas-deploy-508139322599/app/ . --delete",
              "systemctl restart maas-api",
              "sleep 5",
              "curl -sf localhost:8080/v1/health || exit 1"
            ]' \
            --query 'Command.CommandId' --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM CommandId: $CMD_ID"

      - name: SSM 명령 결과 대기 (타임아웃 180초)
        if: steps.filter.outputs.workflow_only != 'true' && steps.check_instance.outputs.running == 'true'
        run: |
          CMD_ID="${{ steps.ssm_send.outputs.command_id }}"
          INSTANCE_ID="${{ secrets.EC2_INSTANCE_ID }}"
          DEADLINE=$((SECONDS + 180))
          STATUS="Pending"

          while [ "$STATUS" = "Pending" ] || [ "$STATUS" = "InProgress" ] || [ "$STATUS" = "Delayed" ]; do
            if [ $SECONDS -ge $DEADLINE ]; then
              echo "::error::SSM 명령이 180초 안에 끝나지 않았습니다 (CommandId=$CMD_ID)"
              exit 1
            fi
            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "status: $STATUS"
          done

          if [ "$STATUS" != "Success" ]; then
            echo "::error::SSM 배포 명령 실패 (Status=$STATUS)"
            aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query 'StandardErrorContent' --output text
            exit 1
          fi
          echo "SSM 배포 명령 성공"

      - name: 배포 후 헬스체크 (공인 IP)
        if: steps.filter.outputs.workflow_only != 'true' && steps.check_instance.outputs.running == 'true'
        run: |
          IP=$(aws ec2 describe-instances \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
          if [ -z "$IP" ] || [ "$IP" = "None" ]; then
            echo "::warning::공인 IP를 확인할 수 없어 외부 헬스체크를 건너뜁니다 (SSM 내부 헬스체크는 이미 통과함)"
            exit 0
          fi
          echo "EC2 공인 IP: $IP"

          RESP=$(curl -sf --max-time 10 "http://$IP:8080/v1/health") \
            || { echo "::error::외부 헬스체크 요청 실패 (보안그룹/방화벽 확인 필요)"; exit 1; }
          echo "$RESP"

          STATUS=$(python3 -c "import json,sys; print(json.loads(sys.argv[1]).get('status'))" "$RESP")
          echo "health status: $STATUS"
          # vLLM(별도 컨테이너)이 일시적으로 준비되지 않으면 status 가
          # degraded 로 나올 수 있다 — 이 배포 자체(maas-api 프로세스)의
          # 성패와는 무관하므로 하드 실패시키지 않고 경고만 남긴다.
          if [ "$STATUS" != "ok" ]; then
            echo "::warning::헬스체크 status='$STATUS' (degraded 등) — vLLM 컨테이너 상태를 별도 확인하세요"
          fi

      - name: 결과 요약
        if: always()
        run: |
          {
            if [ "${{ steps.filter.outputs.workflow_only }}" = "true" ]; then
              echo "### 배포 건너뜀 — .github/workflows/ 전용 커밋"
            elif [ "${{ steps.check_instance.outputs.running }}" = "false" ]; then
              echo "### 배포 건너뜀 — EC2 인스턴스 정지 상태"
            elif [ "${{ job.status }}" = "success" ]; then
              echo "### 배포 성공 (commit \`${{ github.event.workflow_run.head_sha }}\`)"
            else
              echo "### 배포 실패 — 위 로그의 오류 메시지를 확인하세요"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
